
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Product</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

    <header>

        <h1>🌾 Edit Agricultural Product</h1>

        <p>Update your product details</p>

    </header>


    <main>

        <section>

            <h2>✏️ Update Product</h2>


            <form
                action="/update-product/{{ product.id }}"
                method="POST"
            >

                <label for="name">
                    Product Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    value="{{ product.name }}"
                    required
                >


                <label for="price">
                    Price
                </label>

                <input
                    type="number"
                    id="price"
                    name="price"
                    value="{{ product.price }}"
                    required
                >


                <label for="quantity">
                    Quantity
                </label>

                <input
                    type="text"
                    id="quantity"
                    name="quantity"
                    value="{{ product.quantity }}"
                    required
                >


                <label for="location">
                    Location
                </label>

                <input
                    type="text"
                    id="location"
                    name="location"
                    value="{{ product.location }}"
                    required
                >


                <button type="submit">
                    💾 Update Product
                </button>

            </form>


            <div style="text-align:center; margin-top:20px;">

                <a href="/">
                    <button type="button">
                        ← Back to Marketplace
                    </button>
                </a>

            </div>

        </section>

    </main>


    <footer>

        <p>
            🌾 AI-Powered Agriculture Marketplace
        </p>

    </footer>

</body>

</html>
