<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Farmer Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

    <header>

        <div class="header-content">

            <div class="logo">
                🌾
            </div>

            <h1>
                Farmer Login
            </h1>

            <p>
                Login to manage your agricultural products
            </p>

        </div>

    </header>


    <main>

        <section>

            <h2 class="section-title">
                🔐 Login
            </h2>


            {% if error %}

            <div class="error-message">
                {{ error }}
            </div>

            {% endif %}


            <form
                action="/login"
                method="POST"
                class="product-form"
            >

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="primary-button"
                >
                    🔐 Login
                </button>

            </form>


            <div class="auth-link">

                Don't have an account?

                <a href="/register">
                    Register here
                </a>

            </div>

        </section>

    </main>


    <footer>

        <h3>
            🌾 AI-Powered Agriculture Marketplace
        </h3>

        <p>
            Empowering Farmers Through Technology
        </p>

    </footer>

</body>

</html>
